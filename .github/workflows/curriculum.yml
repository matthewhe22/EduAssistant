name: Build curriculum dataset

# Downloads the Victorian Curriculum F–10 Version 2.0 CSV export from VCAA
# (Foundation to Level 6, every learning area and capability), converts it to
# data/curriculum/vc2/*.json and commits the result to the branch.
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/curriculum/download-f10.ts"
      - "scripts/curriculum/import-csv.ts"
      - ".github/workflows/curriculum.yml"

permissions:
  contents: write

concurrency:
  group: curriculum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download curriculum export (f10.vcaa.vic.edu.au)
        run: npm run curriculum:download
      - name: Unzip
        run: unzip -o data/curriculum/raw/vc2-all.zip -d data/curriculum/raw
      - name: Convert to JSON
        run: npm run curriculum:import
      - name: Upload debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: curriculum-debug
          path: data/curriculum/raw/debug
          if-no-files-found: ignore
      - name: Commit dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/curriculum/vc2
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Victorian Curriculum 2.0 dataset (F–6)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"

# Keeps the Render free-plan service awake from 7:00am to 11:59pm Melbourne time, every day.
# Render puts free services to sleep after 15 minutes without traffic, so this pings
# /api/health every 10 minutes during the day (at quiet minutes like :03, :13, because
# GitHub drops scheduled runs most often at :00 and :10) and stops overnight, which also saves
# free instance hours.
#
# GitHub cron runs in UTC, and Melbourne is UTC+10 (winter) or UTC+11 (daylight saving).
# The schedule covers the widest window (20:00-13:59 UTC) and the job checks the real
# Melbourne time itself, so it stays correct all year.
name: Keep warm

on:
  schedule:
    - cron: "3,13,23,33,43,53 20-23,0-13 * * *"
  workflow_dispatch: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

permissions: {}

env:
  APP_URL: https://edassistant-web.onrender.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the app between 7:00am and 11:59pm Melbourne time
        run: |
          hour=$(TZ=Australia/Melbourne date +%H)
          echo "Melbourne time: $(TZ=Australia/Melbourne date '+%Y-%m-%d %H:%M %Z')"
          if [ "$((10#$hour))" -lt 7 ]; then
            echo "Outside 7:00am-11:59pm Melbourne time, letting the app sleep."
            exit 0
          fi
          # A sleeping service can take about a minute to wake, so allow for it and retry.
          if curl --fail --silent --show-error --location --max-time 90 --retry 2 --retry-delay 10 --retry-all-errors "$APP_URL/api/health"; then
            echo
            echo "App is awake."
          else
            echo "::warning::The app did not answer at $APP_URL/api/health"
          fi

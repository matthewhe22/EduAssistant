# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edassistant
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Next.js needs devDependencies (TypeScript, Tailwind) to build.
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending database migrations, then starts Next.js on $PORT.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: EdAssistant
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_EFFORT
        value: medium
      # Extra emails allowed to create accounts (the first account is always allowed).
      - key: ALLOWED_EMAILS
        sync: false

databases:
  - name: EdAssistant
    databaseName: edassistant
    user: edassistant_user
    plan: free
    region: singapore

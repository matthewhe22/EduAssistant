# Render Blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edassistant
    runtime: node
    plan: free
    region: singapore
    branch: main
    # Next.js needs devDependencies (TypeScript, Tailwind) to build.
    buildCommand: npm ci --include=dev && npm run build
    # Applies pending database migrations, then starts Next.js on $PORT.
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: EdAssistant
          property: connectionString
      # AI provider: Tenon (https://mytenon.com). Teachers can also save their own key on the Usage page.
      - key: TENON_API_KEY
        sync: false
      - key: DEFAULT_MODEL
        value: deepseek-v4.1-flash
      # Encrypts API keys saved on the Usage page. Generated once; changing it means keys must be re-entered.
      - key: SETTINGS_SECRET
        generateValue: true
      # Extra emails allowed to create accounts (the first account is always allowed).
      - key: ALLOWED_EMAILS
        sync: false

databases:
  - name: EdAssistant
    databaseName: edassistant
    user: edassistant_user
    plan: free
    region: singapore
